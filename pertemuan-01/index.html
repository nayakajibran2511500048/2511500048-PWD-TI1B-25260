<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kartu Ulang Tahun - Tema Matcha</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6fbf3;
      --matcha:#8fbf63;
      --dark:#3b5a2a;
      --accent:#dfead0;
      --cream:#fffef8;
      --shadow: 0 8px 30px rgba(59,90,42,0.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:Poppins,system-ui,Segoe UI,Arial; background:linear-gradient(180deg,var(--bg),#eef7e8); color:var(--dark);
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
    }

    .card{
      width:100%; max-width:980px; background:var(--cream); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; display:grid; grid-template-columns:1fr 420px;
    }

    .left{
      padding:40px 36px; position:relative; overflow:hidden;
    }
    header{display:flex; align-items:center; gap:16px}
    .badge{
      background:linear-gradient(135deg,var(--matcha),#6fa04a); color:white; font-weight:700; padding:8px 12px; border-radius:999px; box-shadow:0 6px 18px rgba(111,160,74,0.18);
    }
    h1{font-size:36px; margin:18px 0 6px}
    h2{font-size:18px; margin:0 0 18px; color:rgba(27,60,28,0.85)}
    p.lead{margin:18px 0 28px; line-height:1.6; color:rgba(15,40,20,0.9)}

    .cta{display:flex; gap:12px; align-items:center}
    .btn{
      background:var(--dark); color:var(--cream); padding:10px 16px; border-radius:12px; border:none; cursor:pointer; font-weight:600;
    }
    .btn.ghost{background:transparent; color:var(--dark); border:1px solid rgba(27,60,28,0.08)}

    /* Tombol Google Form penuh lebar */
    .wishbox button {
      width: 100%;
      text-align: center;
      padding: 12px 16px;
      font-size: 14px;
    }

    .right{background:linear-gradient(180deg,var(--accent),#eef6e6); padding:30px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px}
    .matcha-cup{width:240px; height:180px; position:relative}

    .cake{
      width:220px; height:140px; background:linear-gradient(180deg,#ffffff,#f0f6ea); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.08); display:flex; align-items:center; justify-content:center; position:relative;
    }
    .sprinkle{position:absolute; width:8px; height:8px; border-radius:3px; background:var(--matcha); opacity:0.95}

    .confetti{position:absolute; inset:0; pointer-events:none}

    footer{font-size:13px; color:rgba(20,50,25,0.6); margin-top:18px}

    @media (max-width:880px){
      .card{grid-template-columns:1fr;}
      .right{order:-1}
    }
  </style>
</head>
<body>
  <div class="card" role="region" aria-label="Kartu ulang tahun tema matcha">
    <div class="left">
      <div class="confetti" id="confetti"></div>
      <header>
        <div class="badge">Matcha Party</div>
        <div style="font-size:13px;color:rgba(20,50,25,0.6)"></div>
      </header>
      <h1 id="name">Selamat Ulang Tahun Nabila</h1>
      <h2 id="sub"></h2>

      <p class="lead"></p>

      <div class="cta">
        <button class="btn" id="play">Nyalakan Konfeti</button>
        <button class="btn ghost" id="download">Download Kartu</button>
      </div>

      <div style="margin-top:18px">
        <div style="font-weight:600;margin-bottom:8px">Tulis pesan untuk temanmu:</div>
        <div class="wishbox">
          <button class="btn" id="openForm">Kirim Pesan</button>
        </div>
        <div style="margin-top:12px; font-size:13px; color:rgba(20,50,25,0.6)">
          Klik tombol kirim pesan
        </div>
      </div>

      <footer>Dibuat oleh Sing ganteng</footer>
    </div>

    <div class="right">
      <svg class="matcha-cup" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi matcha">
        <defs>
          <linearGradient id="g" x1="0" x2="1">
            <stop offset="0" stop-color="#cfe9a8" />
            <stop offset="1" stop-color="#98c265" />
          </linearGradient>
        </defs>
        <rect x="16" y="46" width="288" height="140" rx="18" fill="url(#g)" />
        <circle cx="160" cy="116" r="62" fill="#fffdf5" opacity="0.9" />
        <path d="M90 80 C105 60, 140 60, 150 82" fill="#6fa04a" opacity="0.9"/>
        <path d="M115 60 C132 42, 170 45, 168 70" fill="#8fbf63" opacity="0.85"/>
      </svg>

      <div class="cake" aria-hidden="true" id="cake">
        <div style="text-align:center">
          <div style="font-weight:700; color:var(--dark);">Kue Matcha</div>
          <div style="font-size:12px; color:rgba(30,50,30,0.7); margin-top:8px">maap men dak mirep name ge baru belajar</div>
        </div>
      </div>

      <div style="text-align:center; font-size:14px; color:rgba(20,50,25,0.8);">Klik tombol di kiri untuk konfeti atau tombol "Kirim Pesan" untuk Google Form.</div>
    </div>
  </div>

  <script>
    const confettiContainer = document.getElementById('confetti');
    function makeConfetti(){
      confettiContainer.innerHTML='';
      const count = 50;
      for(let i=0;i<count;i++){
        const el = document.createElement('div');
        el.className='sprinkle';
        el.style.left = Math.random()*120 + '%';
        el.style.top = Math.random()*20 + '%';
        el.style.width = (6+Math.random()*8) + 'px';
        el.style.height = el.style.width;
        el.style.background = ['#7fbf55','#b7e09b','#9ecb6b','#6fa04a'][Math.floor(Math.random()*4)];
        el.style.transform = 'rotate('+Math.random()*360+'deg)';
        el.style.opacity = 0;
        confettiContainer.appendChild(el);
        setTimeout(()=>{
          el.style.transition='all 1200ms cubic-bezier(.16,.8,.3,1)';
          el.style.top = (50 + Math.random()*60)+'%';
          el.style.left = (Math.random()*120)+'%';
          el.style.opacity = 1;
          el.style.transform = 'translateY(20px) rotate('+Math.random()*720+'deg)';
        }, 20 + Math.random()*300);
        setTimeout(()=>el.remove(), 2200 + Math.random()*1000);
      }
    }

    document.getElementById('play').addEventListener('click', ()=>{ makeConfetti(); });

    document.getElementById('download').addEventListener('click', ()=>{
      const doctype = '<!doctype html>\n';
      const html = document.documentElement.outerHTML;
      const blob = new Blob([doctype + html], {type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'kartu-ultah-matcha.html'; a.click(); URL.revokeObjectURL(url);
    });

    document.getElementById('openForm').addEventListener('click', () => {
      const formLink = 'https://docs.google.com/forms/d/e/1FAIpQLScJMoK-FvsW2XjuOHqmnzUgwliTn9d_dOfcck6a0G-C3vwDRA/viewform?usp=dialog';
      window.open(formLink, '_blank');
    });
  </script>
</body>
</html>
